 name: BTC Nhom 9 - ban tin hang ngay
on:
  schedule:
    - cron: "5 1 * * *"
  workflow_dispatch:
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas kagglehub
      - run: cp src/monitoring/notify.py notify.py && python notify.py --kaggle --daily
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
